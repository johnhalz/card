<style>
:root {
  --bg: #ffffff;
  --ink: #12161c;
  --muted: #5a6472;
  --scan: #0b7fe0;
  --on-action: #ffffff;
  --rule: rgba(18, 22, 28, .14);
  --frame: min(42vw, 11rem);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0e14;
    --ink: #eef2f7;
    --muted: #93a0b4;
    --scan: #3aa0ff;
    --on-action: #0a0e14;
    --rule: rgba(238, 242, 247, .16);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  padding: clamp(1.5rem, 6vw, 3rem) clamp(1.25rem, 6vw, 3rem);
  min-height: 100vh;
}
main { max-width: 26rem; }

.frame {
  position: relative;
  width: var(--frame);
  aspect-ratio: 1;
  margin-bottom: clamp(1.5rem, 5vw, 2rem);
  overflow: hidden;
}
.frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  font-size: clamp(2rem, 9vw, 2.75rem);
  font-weight: 650;
  letter-spacing: -.02em;
  line-height: 1.05;
  margin: 0 0 .6rem;
}
.role { margin: 0; font-size: 1rem; }
.where { margin: .15rem 0 0; font-size: .9375rem; color: var(--muted); }

.save {
  display: block;
  margin: clamp(1.75rem, 6vw, 2.5rem) 0 0;
  padding: 1.05rem 1.25rem;
  background: var(--ink);
  color: var(--on-action);
  font-size: 1.0625rem;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  border-radius: 2px;
}
.more {
  display: flex;
  gap: 1.5rem;
  margin-top: 1.1rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--rule);
  font-size: .9375rem;
}
.more a { color: var(--muted); text-decoration-thickness: 1px; text-underline-offset: 3px; }

a:focus-visible, .save:focus-visible {
  outline: 2px solid var(--scan);
  outline-offset: 3px;
}
</style>
